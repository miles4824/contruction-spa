<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mô Phỏng 3 Dạng Đi Ống & Giải Pháp Thông Hơi - The Selena Spa</title>
  <style>
    :root {
      --bg-page: #0f172a;
      --bg-card: #1e293b;
      --bg-panel: #090d16;
      --border: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --red: #dc2626;
      --green: #16a34a;
      --blue: #38bdf8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-page);
      color: var(--text-main);
      line-height: 1.5;
      padding: 16px;
    }
    .container { max-width: 1140px; margin: 0 auto; }
    .header {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px 20px;
      margin-bottom: 16px;
    }
    .header-top {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 14px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
    }
    .header-title h1 { font-size: 19px; font-weight: 700; color: #fff; margin-bottom: 4px; }
    .header-title p { font-size: 13px; color: var(--text-muted); }

    .mode-group { display: flex; gap: 8px; flex-wrap: wrap; }
    .mode-btn {
      border: 1px solid var(--border);
      background: #0f172a;
      color: var(--text-muted);
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .mode-btn.active-bad {
      background: var(--red);
      color: #fff;
      border-color: #ef4444;
      box-shadow: 0 4px 12px rgba(220, 38, 38, 0.35);
    }
    .mode-btn.active-good {
      background: var(--green);
      color: #fff;
      border-color: #22c55e;
      box-shadow: 0 4px 12px rgba(22, 163, 74, 0.35);
    }

    .type-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    @media (max-width: 760px) {
      .type-grid { grid-template-columns: 1fr; }
    }
    .type-btn {
      border: 1px solid var(--border);
      background: #0f172a;
      color: var(--text-muted);
      padding: 11px 12px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s ease;
    }
    .type-btn:hover { color: #fff; border-color: #64748b; }
    .type-btn.active-type {
      border: 2px solid var(--blue);
      background: rgba(56, 189, 248, 0.16);
      color: #fff;
      font-weight: 700;
    }

    .main-grid { display: grid; grid-template-columns: 1.25fr 1fr; gap: 16px; }
    @media (max-width: 860px) { .main-grid { grid-template-columns: 1fr; } }

    .canvas-card {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .info-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      font-size: 13.5px;
    }
    .box-bad {
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.45);
      padding: 14px;
      border-radius: 10px;
      margin-bottom: 14px;
    }
    .box-good {
      background: rgba(34, 197, 94, 0.12);
      border: 1px solid rgba(34, 197, 94, 0.45);
      padding: 14px;
      border-radius: 10px;
      margin-bottom: 14px;
    }
    .box-title-bad { color: #f87171; font-weight: 700; font-size: 15px; margin-bottom: 6px; }
    .box-title-good { color: #4ade80; font-weight: 700; font-size: 15px; margin-bottom: 6px; }
    .bullet-list { list-style: none; display: flex; flex-direction: column; gap: 10px; }
    .bullet-list li {
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 11px 13px;
    }

    @keyframes flowDown {
      0% { transform: translateY(-18px); opacity: 0.95; }
      100% { transform: translateY(42px); opacity: 0.95; }
    }
    @keyframes bubbleBad {
      0% { transform: translate(0, 0) scale(0.75); opacity: 1; }
      100% { transform: translate(-38px, -20px) scale(1.35); opacity: 0; }
    }
    @keyframes escapeGood {
      0% { stroke-dashoffset: 120; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes pulseRed {
      0%, 100% { opacity: 0.42; }
      50% { opacity: 0.72; }
    }
    .water-slug { animation: flowDown 1.9s infinite ease-in; }
    .bubble-bad { animation: bubbleBad 1.4s infinite ease-out; }
    .air-path { stroke-dasharray: 8 6; animation: escapeGood 1.4s infinite linear; }
    .red-zone { animation: pulseRed 1.5s infinite ease-in-out; }
    svg { max-width: 100%; height: auto; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="header-top">
        <div class="header-title">
          <h1>MÔ PHỎNG KẾT QUẢ TEST THỰC TẾ: 3 DẠNG ỐNG TRONG HỘP GEN - THE SELENA SPA</h1>
          <p>Hiện tượng thực tế: Nhấn xả Tầng 1 → Cả Tầng 2 (trên) và Tầng Trệt (dưới) đều ục • Tầng Trệt tự xả rút rất từ từ</p>
        </div>
        <div class="mode-group">
          <button id="btn-mode-bad" class="mode-btn active-bad" onclick="setMode('bad')">1. Hiện tại (Bí khí đỏ & Ục)</button>
          <button id="btn-mode-good" class="mode-btn" onclick="setMode('good')">2. Giải pháp (Hết ục 100%)</button>
        </div>
      </div>

      <div class="type-grid">
        <button id="type-1" class="type-btn active-type" onclick="setType(1)">Dạng 1: Hộp GEN 1 Ống Duy Nhất</button>
        <button id="type-2" class="type-btn" onclick="setType(2)">Dạng 2: Hộp GEN 2 Ống (Cụt Lầu 2)</button>
        <button id="type-3" class="type-btn" onclick="setType(3)">Dạng 3: Trệt Đi Riêng - Lầu Đi Riêng</button>
      </div>
    </div>

    <div class="main-grid">
      <div id="svg-stage" class="canvas-card"></div>
      <div id="desc-stage" class="info-card"></div>
    </div>
  </div>

  <script>
    let currentType = 1;
    let currentMode = 'bad';

    function baseSlabs(isGood, hopGenLabel) {
      return `
        <text x="12" y="22" fill="#94a3b8" font-size="11" font-weight="bold">Mái Chuồng khu</text>
        <rect x="205" y="28" width="215" height="7" fill="#475569" />

        <text x="12" y="70" fill="#94a3b8" font-size="11" font-weight="bold">Tầng thượng</text>
        <rect x="12" y="76" width="240" height="7" fill="#475569" />

        <text x="12" y="140" fill="#94a3b8" font-size="11.5" font-weight="bold">Tầng 2</text>
        <rect x="12" y="146" width="240" height="7" fill="#475569" />

        <text x="12" y="216" fill="#38bdf8" font-size="11.5" font-weight="bold">Tầng 1 (Nhấn xả)</text>
        <rect x="12" y="222" width="240" height="7" fill="#475569" />

        ${isGood ? `
          <text x="12" y="274" fill="#4ade80" font-size="11.5" font-weight="bold">Tầng Trệt (+230mm)</text>
          <rect x="12" y="280" width="240" height="22" fill="#166534" opacity="0.65" stroke="#4ade80" />
          <rect x="12" y="302" width="240" height="7" fill="#475569" />
        ` : `
          <text x="12" y="296" fill="#94a3b8" font-size="11.5" font-weight="bold">Tầng Trệt (Rút từ từ)</text>
          <rect x="12" y="302" width="240" height="7" fill="#475569" />
        `}

        <rect x="252" y="28" width="118" height="281" fill="#1e293b" stroke="#64748b" stroke-dasharray="4 4" />
        <text x="374" y="155" fill="#94a3b8" font-size="11.5" font-weight="bold">Hộp GEN</text>
        <text x="374" y="170" fill="#38bdf8" font-size="10.5" font-weight="bold">${hopGenLabel}</text>
      `;
    }

    function threeToiletsHTML(isGood, pipeX, isBadRed, isSeparateTret) {
      const w = pipeX - 198;
      const tretY = isGood ? 246 : 268;
      const tretBranchY = isGood ? 262 : 284;

      return `
        <path d="M172 112 L198 112 L198 146 L158 146 Z" fill="#e2e8f0" />
        <rect x="189" y="90" width="16" height="24" rx="3" fill="#cbd5e1" />
        <rect x="198" y="128" width="${w}" height="12" fill="#334155" stroke="#94a3b8" />
        ${isBadRed ? `<rect x="198" y="130" width="${w}" height="8" fill="#ef4444" class="red-zone" />` : ''}

        <path d="M172 188 L198 188 L198 222 L158 222 Z" fill="#e2e8f0" />
        <rect x="189" y="166" width="16" height="24" rx="3" fill="#38bdf8" />
        <rect x="198" y="204" width="${w}" height="12" fill="#334155" stroke="#94a3b8" />
        <rect x="200" y="206" width="${w-2}" height="8" fill="#0ea5e9" />

        <path d="M172 ${tretY} L198 ${tretY} L198 ${tretY+34} L158 ${tretY+34} Z" fill="#e2e8f0" />
        <rect x="189" y="${tretY-22}" width="16" height="24" rx="3" fill="#cbd5e1" />
        ${isSeparateTret ? `
          <rect x="178" y="${tretY+34}" width="18" height="${isGood ? 58 : 36}" fill="#334155" stroke="#94a3b8" />
          ${isBadRed ? `<rect x="181" y="${tretY+35}" width="12" height="34" fill="#ef4444" class="red-zone" />` : ''}
        ` : `
          <rect x="198" y="${tretBranchY}" width="${w}" height="12" fill="#334155" stroke="#94a3b8" />
          ${isBadRed ? `<rect x="198" y="${tretBranchY+2}" width="${w}" height="8" fill="#ef4444" class="red-zone" />` : ''}
        `}
      `;
    }

    function bubblesT2AndTretHTML(pipeX) {
      return `
        <path d="M172 112 L200 134 L${pipeX} 134" fill="none" stroke="#f87171" stroke-width="2.5" class="air-path" />
        <circle cx="172" cy="105" r="6" fill="#ef4444" class="bubble-bad" />
        <circle cx="162" cy="96" r="7.5" fill="#f87171" class="bubble-bad" style="animation-delay:0.4s" />
        <text x="14" y="106" fill="#f87171" font-size="11.5" font-weight="bold">3A. Hút ục Tầng 2!</text>

        <path d="M${pipeX} 290 L195 290 L175 268" fill="none" stroke="#f87171" stroke-width="3" class="air-path" />
        <circle cx="172" cy="260" r="6" fill="#ef4444" class="bubble-bad" />
        <circle cx="162" cy="250" r="8" fill="#f87171" class="bubble-bad" style="animation-delay:0.5s" />
        <text x="14" y="258" fill="#f87171" font-size="11.5" font-weight="bold">3B. Nén ục Tầng Trệt!</text>
      `;
    }

    const scenarios = {
      1: {
        badSVG: `
          <svg viewBox="0 0 435 425">
            ${baseSlabs(false, '(Dạng 1 ống)')}
            <rect x="180" y="318" width="215" height="98" rx="6" fill="#0f172a" stroke="#64748b" stroke-width="2" />
            <rect x="182" y="344" width="211" height="70" rx="4" fill="#1e3a8a" opacity="0.8" />
            <line x1="182" y1="344" x2="393" y2="344" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6 4" />
            <text x="192" y="402" fill="#93c5fd" font-size="11.5" font-weight="bold">HẦM TỰ HOẠI (Mực nước ngập đáy ống)</text>

            <rect x="282" y="112" width="26" height="248" fill="#334155" stroke="#94a3b8" stroke-width="1.5" />
            <rect x="288" y="8" width="14" height="104" fill="#334155" stroke="#94a3b8" stroke-width="1.5" />
            <text x="308" y="20" fill="#38bdf8" font-size="11" font-weight="bold">Ống hơi Φ34-42</text>

            <rect x="290" y="36" width="10" height="76" fill="#ef4444" class="red-zone" />
            <rect x="285" y="114" width="20" height="90" fill="#ef4444" class="red-zone" />
            <rect x="285" y="242" width="20" height="102" fill="#ef4444" class="red-zone" />

            ${threeToiletsHTML(false, 282, true, false)}

            <rect x="285" y="212" width="20" height="36" rx="4" fill="#0ea5e9" class="water-slug" />
            <text x="314" y="232" fill="#38bdf8" font-size="11" font-weight="bold">← Nước T1 lao xuống</text>

            <circle cx="295" cy="32" r="10" fill="#ef4444" />
            <text x="291" y="36" fill="#fff" font-size="12" font-weight="bold">X</text>
            <text x="310" y="52" fill="#fca5a5" font-size="11" font-weight="bold">1. Tắc cổ Chuồng khu</text>
            <text x="310" y="66" fill="#fca5a5" font-size="10.5" font-weight="bold">(Khí đỏ trên bị rút!)</text>

            <circle cx="295" cy="356" r="10" fill="#ef4444" />
            <text x="291" y="360" fill="#fff" font-size="12" font-weight="bold">X</text>
            <text x="14" y="336" fill="#fca5a5" font-size="11" font-weight="bold">2. Đáy ống ngập nước hầm</text>
            <text x="14" y="351" fill="#fca5a5" font-size="11" font-weight="bold">→ Khí đỏ dưới bị nén cứng!</text>
            <line x1="172" y1="340" x2="282" y2="354" stroke="#ef4444" stroke-width="2" />

            ${bubblesT2AndTretHTML(285)}
          </svg>
        `,
        goodSVG: `
          <svg viewBox="0 0 435 425">
            ${baseSlabs(true, '(Dạng 1 ống)')}
            <rect x="180" y="318" width="215" height="98" rx="6" fill="#0f172a" stroke="#64748b" stroke-width="2" />
            <rect x="182" y="352" width="211" height="62" rx="4" fill="#1e3a8a" opacity="0.8" />
            <line x1="182" y1="352" x2="393" y2="352" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6 4" />
            <text x="192" y="402" fill="#93c5fd" font-size="11.5" font-weight="bold">HẦM TỰ HOẠI (Đã hút hạ mực nước)</text>

            <rect x="282" y="112" width="26" height="248" fill="#334155" stroke="#94a3b8" stroke-width="1.5" />
            <rect x="288" y="8" width="14" height="104" fill="#334155" stroke="#94a3b8" stroke-width="1.5" />

            <path d="M288 56 L145 56 L145 20" fill="none" stroke="#22c55e" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M288 56 L145 56 L145 20" fill="none" stroke="#0f172a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
            <text x="35" y="15" fill="#4ade80" font-size="11.5" font-weight="bold">1. Mở Chữ T Tầng Thượng (Cứu Tầng 2!)</text>
            <path d="M145 18 L145 56 L295 56 L295 195" fill="none" stroke="#38bdf8" stroke-width="3" class="air-path" />

            <path d="M308 290 L348 290 L348 330" fill="none" stroke="#22c55e" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M308 290 L348 290 L348 330" fill="none" stroke="#0f172a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
            <circle cx="328" cy="290" r="19" fill="none" stroke="#4ade80" stroke-width="2" stroke-dasharray="3 3" />
            <text x="315" y="242" fill="#4ade80" font-size="11" font-weight="bold">2. Chữ Y thông</text>
            <text x="315" y="256" fill="#4ade80" font-size="11" font-weight="bold">trần hầm (Cứu Trệt!)</text>

            ${threeToiletsHTML(true, 282, false, false)}
            <rect x="285" y="212" width="20" height="36" rx="4" fill="#0ea5e9" class="water-slug" />
            <path d="M295 250 L295 290 L348 290 L348 335" fill="none" stroke="#4ade80" stroke-width="3.5" class="air-path" />
            <text x="14" y="175" fill="#4ade80" font-size="12" font-weight="bold">Cả 3 tầng xoáy cái ọt - Êm 100%!</text>
          </svg>
        `,
        badDesc: `
          <div class="box-bad">
            <div class="box-title-bad">❌ Dạng 1 (Hiện tại): Tại sao nhấn Tầng 1 thì CẢ Tầng 2 và Trệt đều ục?</div>
            <p>Khi <b>Tầng 1 (ở giữa)</b> nhấn xả, cục nước xanh lao nhanh xuống ống Φ90 như một cái pít-tông:</p>
          </div>
          <ul class="bullet-list">
            <li><b>1 & 3A (Phía trên Tầng 1):</b> Do cổ ống trên mái Chuồng khu bị tắc/nghẽn (<b>Dấu X trên</b>), cục nước Tầng 1 lao xuống làm <b>rút chân không vùng khí đỏ phía trên</b> → Hút nước bồn cầu <b>Tầng 2 kêu "ục"</b>!</li>
            <li><b>2 & 3B (Phía dưới Tầng 1):</b> Do đáy ống dưới hầm bị ngập nước (<b>Dấu X dưới</b>), cục nước Tầng 1 đè xuống làm <b>nén cứng vùng khí đỏ phía dưới</b> → Phụt bọt làm <b>Tầng Trệt kêu "ục"</b> (và làm Tầng trệt tự xả thì rút rất từ từ)!</li>
          </ul>
        `,
        goodDesc: `
          <div class="box-good">
            <div class="box-title-good">✅ Giải pháp Dạng 1: Mở khóa cả Đỉnh (Tầng Thượng) & Đáy (Tầng Trệt)</div>
            <p>Giải phóng cả 2 vùng khí đỏ trên và dưới:</p>
          </div>
          <ul class="bullet-list">
            <li><b>1. Mở Chữ T ở Tầng Thượng (Đúng hình sếp vẽ!):</b> Đục hộp GEN dưới chỗ tắc Chuồng khu mở ống thông hơi ra ngoài → Khí trời (xanh dương) tràn xuống bù áp ngay khi Tầng 1 xả, <b>Tầng 2 hết sạch tiếng ục</b>!</li>
            <li><b>2. Mở Chữ Y + Hút hầm lúc nâng nền (+230mm):</b> Nâng bồn cầu Trệt cao thêm 23cm + hút hạ nước hầm + đấu Chữ Y thông hơi trần hầm → <b>Tầng Trệt xoáy cái ọt và hết sạch sủi bọt</b>!</li>
          </ul>
        `
      },

      2: {
        badSVG: `
          <svg viewBox="0 0 435 425">
            ${baseSlabs(false, '(Dạng 2 ống)')}
            <rect x="180" y="318" width="215" height="98" rx="6" fill="#0f172a" stroke="#64748b" stroke-width="2" />
            <rect x="182" y="344" width="211" height="70" rx="4" fill="#1e3a8a" opacity="0.8" />
            <line x1="182" y1="344" x2="393" y2="344" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6 4" />
            <text x="192" y="402" fill="#93c5fd" font-size="11.5" font-weight="bold">HẦM TỰ HOẠI (Mực nước ngập đáy 2 ống)</text>

            <rect x="264" y="112" width="26" height="248" fill="#334155" stroke="#94a3b8" stroke-width="1.5" />
            <rect x="261" y="105" width="32" height="8" fill="#ef4444" />
            <text x="195" y="100" fill="#fca5a5" font-size="11" font-weight="bold">1. Ống Φ90 bị cụt đầu ở Tầng 2!</text>

            <rect x="334" y="8" width="14" height="352" fill="#334155" stroke="#94a3b8" stroke-width="1.5" />
            <text x="308" y="14" fill="#38bdf8" font-size="11" font-weight="bold">Ống hơi Φ42</text>

            <rect x="267" y="114" width="20" height="90" fill="#ef4444" class="red-zone" />
            <rect x="267" y="242" width="20" height="102" fill="#ef4444" class="red-zone" />

            ${threeToiletsHTML(false, 264, true, false)}
            <rect x="267" y="212" width="20" height="36" rx="4" fill="#0ea5e9" class="water-slug" />

            <circle cx="277" cy="356" r="10" fill="#ef4444" />
            <text x="273" y="360" fill="#fff" font-size="12" font-weight="bold">X</text>
            <circle cx="341" cy="356" r="10" fill="#ef4444" />
            <text x="337" y="360" fill="#fff" font-size="12" font-weight="bold">X</text>
            <text x="14" y="336" fill="#fca5a5" font-size="11" font-weight="bold">2. Đáy 2 ống ngập nước hầm</text>
            <text x="14" y="351" fill="#fca5a5" font-size="11" font-weight="bold">→ Khí đỏ không sang Φ42 được!</text>
            <line x1="172" y1="340" x2="265" y2="354" stroke="#ef4444" stroke-width="2" />

            ${bubblesT2AndTretHTML(267)}
          </svg>
        `,
        goodSVG: `
          <svg viewBox="0 0 435 425">

      document.getElementById('btn-mode-good').className = (currentMode === 'good') ? 'mode-btn active-good' : 'mode-btn';

        document.getElementById('type-' + i).className = (i === currentType) ? 'type-btn active-type' : 'type-btn';
      }
    }
